<div id="form">
  <div class="brand">사주구조대</div>
  <h1>나 퇴사해도 돼?</h1>

<div id="result" class="hide"></div>

<script>
/* ===== 계산 엔진 ===== */
var STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var TERMS=[[1,6,'丑'],[2,4,'寅'],[3,6,'卯'],[4,5,'辰'],[5,6,'巳'],[6,6,'午'],
[7,7,'未'],[8,8,'申'],[9,8,'酉'],[10,8,'戌'],[11,7,'亥'],[12,7,'子']];
var MONTH_START={'甲':'丙','己':'丙','乙':'戊','庚':'戊','丙':'庚','辛':'庚','丁':'壬','壬':'壬','戊':'甲','癸':'甲'};
var HOUR_START={'甲':'甲','己':'甲','乙':'丙','庚':'丙','丙':'戊','辛':'戊','丁':'庚','壬':'庚','戊':'壬','癸':'壬'};
var STEM_EL={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
var BRANCH_EL={'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
var YIN={'甲':0,'乙':1,'丙':0,'丁':1,'戊':0,'己':1,'庚':0,'辛':1,'壬':0,'癸':1};
var CYCLE={木:'火',火:'土',土:'金',金:'水',水:'木'};
var CTRL={木:'土',土:'水',水:'火',火:'金',金:'木'};

var CAL='solar';
function setCal(t){
  CAL=t;
  document.getElementById('bSol').className = (t==='solar'?'on':'');
  document.getElementById('bLun').className = (t==='lunar'?'on':'');
  document.getElementById('leapBox').className = (t==='lunar'?'leap':'leap hide');
  if(t==='solar') document.getElementById('leap').checked=false;
}

/* 음력 → 양력 변환 */
function lunarToSolar(y,m,d,isLeap){
  if(typeof Lunar==='undefined') return null;
  try{
    var lm = isLeap ? -m : m;
    var s = Lunar.fromYmd(y,lm,d).getSolar();
    return {y:s.getYear(), m:s.getMonth(), d:s.getDay()};
  }catch(e){ return null; }
}

function getIlju(y,m,d){
  var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  var j=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)
        -Math.floor(yy/100)+Math.floor(yy/400)-32045;
  var i=(j+49)%60;
  return STEMS[i%10]+BRANCHES[i%12];
}
function getYeonju(y,m,d){
  if(m===1||(m===2&&d<4))y=y-1;
  return STEMS[(y-4)%10]+BRANCHES[(y-4)%12];
}
function getWolju(y,m,d){
  var i=TERMS.findIndex(function(t){return t[0]===m;});
  if(d<TERMS[i][1])i=(i+11)%12;
  var jiji=TERMS[i][2];
  var yy=(m===1||(m===2&&d<4))?y-1:y;
  var g=STEMS[(yy-4)%10];
  var step=(BRANCHES.indexOf(jiji)-2+12)%12;
  return STEMS[(STEMS.indexOf(MONTH_START[g])+step)%10]+jiji;
}
function getSiju(y,m,d,h,mi){
  if(h===null)return null;
  var adj=h*60+mi-32;
  var idx=Math.floor(((adj+60+1440)%1440)/120);
  return STEMS[(STEMS.indexOf(HOUR_START[getIlju(y,m,d)[0]])+idx)%10]+BRANCHES[idx];
}
function getSaju(y,m,d,h,mi){
  return{연주:getYeonju(y,m,d),월주:getWolju(y,m,d),
         일주:getIlju(y,m,d),시주:getSiju(y,m,d,h,mi)};
}
function analyze(s){
  var c={木:0,火:0,土:0,金:0,水:0};
  ['연주','월주','일주','시주'].forEach(function(k){
    var p=s[k];if(!p)return;
    c[STEM_EL[p[0]]]++;c[BRANCH_EL[p[1]]]++;
  });
  var st=Object.keys(c).sort(function(a,b){return c[b]-c[a];});
  return{일간:s.일주[0],최다:st[0],최소:st[st.length-1],개수:c,사주:s};
}
function sipsin(me,t){
  var a=STEM_EL[me],b=STEM_EL[t],same=YIN[me]===YIN[t];
  if(b===a)return same?'비견':'겁재';
  if(CYCLE[a]===b)return same?'식신':'상관';
  if(CTRL[a]===b)return same?'편재':'정재';
  if(CTRL[b]===a)return same?'편관':'정관';
  return same?'편인':'정인';
}

TEXT.lacking['水']={mistake:'융통성이 없다. 한 방식이 안 통하는데도 더 열심히 그 방식을 반복한다. 쉬는 걸 게으름으로 여기는 것도 이 결핍에서 온다. 막히면 더 밀지 말고 하루 손 떼라. 그게 최단 경로다.'};

TEXT.daily['비견']={text:'오늘은 네 고집이 세지는 날이다. 남 조언이 잘 안 들어온다.',action:'혼자 하는 일을 앞에 배치해라'};
TEXT.daily['겁재']={text:'경쟁 구도가 서는 날이다. 비교당하거나 뺏기는 기분이 들 수 있다.',action:'오늘 큰 돈 쓰는 결정은 미뤄라'};
TEXT.daily['식신']={text:'입이 잘 풀리고 컨디션이 좋은 날이다. 사람 만나기 좋다.',action:'미뤄둔 연락 하나 오늘 해라'};
TEXT.daily['상관']={text:'하고 싶은 말이 튀어나오는 날이다. 아이디어는 좋은데 말이 세다.',action:'보내기 전에 한 번만 다시 읽어라'};
TEXT.daily['편재']={text:'기회가 지나가는 날이다. 솔깃한 게 여러 개 보인다.',action:'솔깃한 제안은 하루 재워둬라'};
TEXT.daily['정재']={text:'꾸준한 게 보상받는 날이다. 화려하진 않아도 확실하다.',action:'가계부든 정산이든 숫자를 맞춰라'};
TEXT.daily['편관']={text:'압박이 들어오는 날이다. 일이 몰리거나 지적을 받을 수 있다.',action:'급한 것부터 하나씩만 처리해라'};
TEXT.daily['정관']={text:'규칙과 평가가 작동하는 날이다. 성실하게 굴면 그대로 점수가 된다.',action:'시간 약속을 제일 신경 써라'};
TEXT.daily['편인']={text:'생각이 깊어지는 날이다. 사람보다 혼자가 편하다.',action:'배우거나 읽는 데 시간을 써라'};
TEXT.daily['정인']={text:'도움이 들어오는 날이다. 물어보면 답이 나온다.',action:'모르는 건 오늘 물어봐라'};

/* ===== 화면 ===== */
var sel=document.getElementById('h');
for(var i=0;i<24;i++){
  var o=document.createElement('option');
  o.value=i; o.textContent=(i<10?'0':'')+i+'시 무렵';
  sel.appendChild(o);
}

function go(){
  var eb=document.getElementById('err'); eb.innerHTML='';
  var y=parseInt(document.getElementById('y').value,10);
  var m=parseInt(document.getElementById('m').value,10);
  var d=parseInt(document.getElementById('d').value,10);
  var hv=document.getElementById('h').value;
  var h=(hv==='')?null:parseInt(hv,10);

  if(!y||!m||!d||y<1900||y>2100||m<1||m>12||d<1||d>31){
    eb.innerHTML='<p class="err">생년월일을 다시 확인해 주세요.</p>'; return;
  }

  var sy=y, sm=m, sd=d, calNote='';
  if(CAL==='lunar'){
    var isLeap=document.getElementById('leap').checked;
    var c=lunarToSolar(y,m,d,isLeap);
    if(!c){
      eb.innerHTML='<p class="err">그 날짜는 음력에 없는 날이에요. 날짜나 윤달 여부를 확인해 주세요.</p>'; return;
    }
    sy=c.y; sm=c.m; sd=c.d;
    calNote='음력 '+y+'.'+m+'.'+d+(isLeap?' (윤달)':'')+' → 양력 '+sy+'.'+sm+'.'+sd;
  }

  var a=analyze(getSaju(sy,sm,sd,h===null?null:h,30));
  var ig=TEXT.ilgan[a.일간], dm=TEXT.dominant[a.최다], lk=TEXT.lacking[a.최소];
  var n=new Date();
  var todayGan=getIlju(n.getFullYear(),n.getMonth()+1,n.getDate())[0];
  var rel=sipsin(a.일간,todayGan), dy=TEXT.daily[rel];

  var bars='';
  ['木','火','土','金','水'].forEach(function(k){
    var name={木:'나무',火:'불',土:'흙',金:'쇠',水:'물'}[k];
    var v=a.개수[k];
    bars+='<div class="bar"><i>'+name+'</i><em class="'+(v===0?'zero':'')+
      '" style="width:'+(v*30+3)+'px"></em><span>'+v+'</span></div>';
  });

  var warn='';
  if(h!==null&&(h===0||h===1||h===23)){
    warn='<p class="note">밤 11시~새벽 2시 사이 출생은 해석이 갈릴 수 있어요.</p>';
  }
  var noTime = (h===null)?'<p class="note">태어난 시간을 몰라 세 기둥으로만 봤어요. 시간을 알면 더 정확해집니다.</p>':'';

  document.getElementById('form').className='hide';
  var r=document.getElementById('result');
  r.className='';
  r.innerHTML=
'<div class="shot"><div class="sbrand">사주구조대</div>'+
'<div class="big">'+ig.badge+'</div>'+
'<div class="quote">"'+ig.oneline+'"</div>'+
'<div class="url">good-saju.github.io</div></div>'+
'<p class="shotnote">이 부분만 캡처해서 보내면 됩니다</p>'+


    '<div class="card"><h2>타고난 기운</h2>'+bars+
    (calNote?'<p class="tag" style="margin-top:10px">'+calNote+'</p>':'')+'</div>'+

    '<div class="card"><h2>타고난 성향</h2><p>'+ig.trait+'</p></div>'+
    '<div class="card"><h2>돈 버는 방식</h2><p>'+dm.money+'</p></div>'+
    '<div class="card"><h2>자주 하는 실수</h2><p>'+lk.mistake+'</p></div>'+

    '<div class="card"><h2>오늘은 어떤 날</h2><p>'+dy.text+'</p>'+
    '<div class="act">'+dy.action+'</div></div>'+

    '<details><summary>내 사주 원문 보기</summary>'+
    '<table><tr><th>태어난 해</th><th>태어난 달</th><th>태어난 날</th><th>태어난 시</th></tr>'+
    '<tr><td>'+a.사주.연주+'</td><td>'+a.사주.월주+'</td><td>'+a.사주.일주+'</td><td>'+
    (a.사주.시주||'—')+'</td></tr></table>'+
    '<p class="tag" style="margin-top:12px">가운데 아래 '+a.일간+
    ' 이 글자가 나를 나타내는 글자입니다. 이걸 기준으로 위 해석이 나왔어요.</p>'+
    '</details>'+
    warn+noTime+
    '<button onclick="location.reload()">다시 보기</button>'+
    '<p class="foot">사주구조대 · 재미로 보는 콘텐츠입니다<br>중요한 결정은 스스로 하세요</p>';
  window.scrollTo(0,0);
}
</script>
