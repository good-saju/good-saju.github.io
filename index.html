<script>
/* ===== 계산 엔진 ===== */
var STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var BRANCHES=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var TERMS=[[1,6,'丑'],[2,4,'寅'],[3,6,'卯'],[4,5,'辰'],[5,6,'巳'],[6,6,'午'],
[7,7,'未'],[8,8,'申'],[9,8,'酉'],[10,8,'戌'],[11,7,'亥'],[12,7,'子']];
var MONTH_START={'甲':'丙','己':'丙','乙':'戊','庚':'戊','丙':'庚','辛':'庚','丁':'壬','壬':'壬','戊':'甲','癸':'甲'};
var HOUR_START={'甲':'甲','己':'甲','乙':'丙','庚':'丙','丙':'戊','辛':'戊','丁':'庚','壬':'庚','戊':'壬','癸':'壬'};
var STEM_EL={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
var BRANCH_EL={'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
var YIN={'甲':0,'乙':1,'丙':0,'丁':1,'戊':0,'己':1,'庚':0,'辛':1,'壬':0,'癸':1};
var CYCLE={木:'火',火:'土',土:'金',金:'水',水:'木'};
var CTRL={木:'土',土:'水',水:'火',火:'金',金:'木'};

function getIlju(y,m,d){
  var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  var j=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)
        -Math.floor(yy/100)+Math.floor(yy/400)-32045;
  var i=(j+49)%60;
  return STEMS[i%10]+BRANCHES[i%12];
}
function getYeonju(y,m,d){
  if(m===1||(m===2&&d<4))y=y-1;
  return STEMS[(y-4)%10]+BRANCHES[(y-4)%12];
}
function getWolju(y,m,d){
  var i=TERMS.findIndex(function(t){return t[0]===m;});
  if(d<TERMS[i][1])i=(i+11)%12;
  var jiji=TERMS[i][2];
  var yy=(m===1||(m===2&&d<4))?y-1:y;
  var g=STEMS[(yy-4)%10];
  var step=(BRANCHES.indexOf(jiji)-2+12)%12;
  return STEMS[(STEMS.indexOf(MONTH_START[g])+step)%10]+jiji;
}
function getSiju(y,m,d,h,mi){
  if(h===null)return null;
  var adj=h*60+mi-32;
  var idx=Math.floor(((adj+60+1440)%1440)/120);
  return STEMS[(STEMS.indexOf(HOUR_START[getIlju(y,m,d)[0]])+idx)%10]+BRANCHES[idx];
}
function getSaju(y,m,d,h,mi){
  return{연주:getYeonju(y,m,d),월주:getWolju(y,m,d),
         일주:getIlju(y,m,d),시주:getSiju(y,m,d,h,mi)};
}
function analyze(s){
  var c={木:0,火:0,土:0,金:0,水:0};
  ['연주','월주','일주','시주'].forEach(function(k){
    var p=s[k];if(!p)return;
    c[STEM_EL[p[0]]]++;c[BRANCH_EL[p[1]]]++;
  });
  var st=Object.keys(c).sort(function(a,b){return c[b]-c[a];});
  return{일간:s.일주[0],최다:st[0],최소:st[st.length-1],개수:c,사주:s};
}
function sipsin(me,t){
  var a=STEM_EL[me],b=STEM_EL[t],same=YIN[me]===YIN[t];
  if(b===a)return same?'비견':'겁재';
  if(CYCLE[a]===b)return same?'식신':'상관';
  if(CTRL[a]===b)return same?'편재':'정재';
  if(CTRL[b]===a)return same?'편관':'정관';
  return same?'편인':'정인';
}

'편재':{text:'기회가 지나가는 날이다. 돈 될 것 같은 얘기가 들어오는데 확인 없이 물면 손해다.',action:'솔깃한 제안은 하루 재워둬라'},
'정재':{text:'꾸준한 게 보상받는 날이다. 크지 않지만 확실한 게 들어온다.',action:'가계부든 정산이든 숫자를 맞춰라'},
'편관':{text:'압박이 들어오는 날이다. 예상 못 한 일이 떨어지거나 위에서 찍는다.',action:'급한 것부터 하나씩만 처리해라'},
'정관':{text:'규칙과 평가가 작동하는 날이다. 성실하게 굴면 그대로 점수가 된다.',action:'시간 약속을 제일 신경 써라'},
'편인':{text:'생각이 깊어지는 날이다. 통찰이 오는 대신 혼자 파고들다 우울해질 수도 있다.',action:'배우거나 읽는 데 시간을 써라'},
'정인':{text:'도움이 들어오는 날이다. 누가 챙겨주거나 배울 자리가 생긴다.',action:'모르는 건 오늘 물어봐라'}};

/* ===== 화면 ===== */
var sel=document.getElementById('h');
for(var i=0;i<24;i++){
  var o=document.createElement('option');
  o.value=i;o.text=(i<10?'0'+i:i)+'시 무렵';
  sel.appendChild(o);
}

function go(){
  var y=+document.getElementById('y').value,
      m=+document.getElementById('m').value,
      d=+document.getElementById('d').value,
      hv=document.getElementById('h').value;

  if(!y||!m||!d||m<1||m>12||d<1||d>31||y<1900||y>2030){
    alert('생년월일을 다시 확인해줘. (예: 1990 / 3 / 15)');return;
  }
  var h=(hv==='')?null:+hv;
  var a=analyze(getSaju(y,m,d,h,30));
  var t=TEXT.ilgan[a.일간];
  var n=new Date();
  var todayGan=getIlju(n.getFullYear(),n.getMonth()+1,n.getDate())[0];
  var rel=sipsin(a.일간,todayGan);
  var dl=TEXT.daily[rel];

  var max=Math.max.apply(null,['木','火','土','金','水'].map(function(k){return a.개수[k];}));
  var bars=['木','火','土','金','水'].map(function(k){
    var w=a.개수[k]/Math.max(max,1)*140;
    var nm={木:'나무',火:'불',土:'흙',金:'쇠',水:'물'}[k];
    return '<div class="bar"><i>'+nm+'</i><em class="'+(a.개수[k]===0?'zero':'')
          +'" style="width:'+w+'px"></em>'+a.개수[k]+'</div>';
  }).join('');

  var s=a.사주;
  var raw='<table><tr><th>태어난 해</th><th>태어난 달</th><th>태어난 날</th><th>태어난 시간</th></tr>'
    +'<tr><td>'+s.연주+'</td><td>'+s.월주+'</td><td>'+s.일주+'</td><td>'+(s.시주||'—')+'</td></tr></table>'
    +'<p class="note">가운데 아래 <b>'+s.일주[0]+'</b>가 너를 나타내는 글자다. 이 앱의 진단은 이 글자와 위 여덟 글자의 기운 분포를 기준으로 나온다.'
    +(h===null?' 시간을 안 넣었으니 마지막 칸은 비어 있고, 그만큼 해석 범위가 줄어든다.':'')
    +'</p>';

  var warn='';
  if(h!==null&&(h===0||h===1||h===23)){
    warn='<p class="note">밤 11시~새벽 1시 무렵 출생은 계산 기준이 갈리는 구간이라, 다른 곳과 결과가 다를 수 있다.</p>';
  }

  document.getElementById('form').className='hide';
  var r=document.getElementById('result');
  r.className='';
  r.innerHTML=
    '<div class="brand">팔자구조대 진단서</div>'
   +'<div class="card hero"><div class="badge">네 팔자 유형</div>'
     +'<div class="big">'+t.badge+'</div>'
     +'<div class="tag">'+a.최다+'(‘+{木:"나무",火:"불",土:"흙",金:"쇠",水:"물"}[a.최다]+’) 기운이 많고 '
     +{木:'나무',火:'불',土:'흙',金:'쇠',水:'물'}[a.최소]+' 기운이 부족한 구조</div></div>'
   +'<div class="card"><h2>한 줄 진단</h2><div class="quote">“'+t.oneline+'”</div></div>'
   +'<div class="card"><h2>타고난 성향</h2><p>'+t.trait+'</p></div>'
   +'<div class="card"><h2>돈 버는 방식</h2><p>'+TEXT.dominant[a.최다].money+'</p></div>'
   +'<div class="card"><h2>반복하는 실수</h2><p>'+TEXT.lacking[a.최소].mistake+'</p></div>'
   +'<div class="card"><h2>기운 분포</h2>'+bars+'</div>'
   +'<div class="card"><h2>오늘 되는 날이야?</h2><p>'+dl.text+'</p>'
     +'<div class="act">오늘의 처방 · '+dl.action+'</div></div>'
   +'<details><summary>내 사주 원문 보기 (직접 확인용)</summary>'+raw+warn+'</details>'
   +'<button onclick="location.reload()">다른 사람 팔자 보기</button>'
   +'<p class="foot">팔자구조대 · 재미로 보는 참고용 콘텐츠입니다.<br>중요한 결정은 네 판단으로 하세요.</p>';
  window.scrollTo(0,0);
}
</script>
